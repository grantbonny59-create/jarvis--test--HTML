<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050d0c">
    <title>J.A.R.V.I.S</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #050d0c;
        --panel: #0a1615;
        --edge: #163330;
        --accent: #2dd4bf;
        --dim: #145c53;
        --amber: #ffb86b;
        --text: #dffaf5;
        --muted: #6f9a92;
        --danger: #ff7b7b;
        --orb: 220px
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent
      }

      html,
      body {
        margin: 0;
        height: 100%
      }

      body {
        background: radial-gradient(circle at 30% 0%, #0d211e 0%, var(--bg) 60%);
        color: var(--text);
        font: 15px/1.5 Inter, system-ui, sans-serif
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image: linear-gradient(rgba(45, 212, 191, .045) 1px, transparent 1px), linear-gradient(90deg, rgba(45, 212, 191, .045) 1px, transparent 1px);
        background-size: 32px 32px;
        -webkit-mask-image: radial-gradient(circle at 30% 25%, #000, transparent 70%);
        mask-image: radial-gradient(circle at 30% 25%, #000, transparent 70%)
      }

      .app {
        position: relative;
        height: 100dvh;
        max-width: 1180px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: minmax(300px, 400px) 1fr;
        gap: 32px;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom))
      }

      .hud {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px
      }

      .brand {
        font: 900 22px Orbitron, sans-serif;
        letter-spacing: 8px;
        color: var(--accent);
        text-shadow: 0 0 18px rgba(45, 212, 191, .55);
        text-align: center;
        padding-left: 8px
      }

      .brand small {
        display: block;
        font: 400 12px "JetBrains Mono", monospace;
        letter-spacing: 1px;
        color: var(--muted);
        text-shadow: none;
        margin-top: 6px
      }

      .clock {
        font: 400 12px "JetBrains Mono", monospace;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 8px
      }

      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 6px var(--accent)
      }

      .orb-outer {
        position: relative;
        width: var(--orb);
        height: var(--orb);
        display: grid;
        place-items: center;
        margin: 4px 0
      }

      .bezel {
        position: absolute;
        inset: -12px;
        border-radius: 50%;
        border: 1px dashed rgba(45, 212, 191, .3);
        animation: spin 18s linear infinite
      }

      @keyframes spin {
        to {
          transform: rotate(360deg)
        }
      }

      #globe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none
      }

      .orb {
        position: relative;
        width: 34%;
        aspect-ratio: 1;
        border-radius: 50%;
        border: 0;
        cursor: pointer;
        background: radial-gradient(circle at 35% 30%, #9dfff0, #2dd4bf 40%, #0b3f39);
        box-shadow: 0 0 30px rgba(45, 212, 191, .6), inset 0 0 20px rgba(255, 255, 255, .2);
        transition: transform .15s
      }

      .orb:active {
        transform: scale(.95)
      }

      .orb.listening {
        animation: pulse 1.4s ease-in-out infinite
      }

      .orb.thinking {
        animation: glow 1.6s linear infinite
      }

      @keyframes pulse {
        50% {
          box-shadow: 0 0 56px rgba(45, 212, 191, .95), inset 0 0 28px rgba(255, 255, 255, .3)
        }
      }

      @keyframes glow {
        50% {
          filter: brightness(1.3) hue-rotate(20deg)
        }
      }

      .status {
        font: 500 13px "JetBrains Mono", monospace;
        color: var(--muted);
        min-height: 20px;
        transition: color .3s
      }

      .status.live {
        color: var(--accent)
      }

      .status.speaking {
        color: var(--amber)
      }

      .dials {
        display: flex;
        gap: 28px
      }

      .dial {
        position: relative;
        width: 64px;
        text-align: center
      }

      .dial svg {
        width: 64px;
        height: 64px;
        display: block
      }

      .dial .t {
        fill: none;
        stroke: var(--edge);
        stroke-width: 4
      }

      .dial .p {
        fill: none;
        stroke: var(--accent);
        stroke-width: 4;
        stroke-linecap: round;
        transform: rotate(-90deg);
        transform-origin: 32px 32px;
        transition: stroke-dashoffset .6s
      }

      .dial b {
        position: absolute;
        top: 0;
        left: 0;
        width: 64px;
        height: 64px;
        display: grid;
        place-items: center;
        font: 600 13px "JetBrains Mono", monospace
      }

      .dial span {
        display: block;
        margin-top: 8px;
        font-size: 12px;
        color: var(--muted)
      }

      .work {
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-height: 0
      }

      .tabs {
        display: flex;
        gap: 8px
      }

      .tab {
        flex: 1;
        padding: 10px 12px;
        background: var(--panel);
        border: 1px solid var(--edge);
        color: var(--muted);
        border-radius: 10px;
        font: 500 14px Inter, sans-serif;
        cursor: pointer
      }

      .tab.active {
        color: var(--accent);
        border-color: var(--dim);
        background: #0d211d;
        box-shadow: 0 0 14px rgba(45, 212, 191, .2)
      }

      .panel {
        display: none;
        flex: 1;
        min-height: 0;
        flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 14px;
        overflow: hidden
      }

      .panel.active {
        display: flex
      }

      .scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px
      }

      .msg {
        max-width: min(85%, 560px);
        padding: 10px 14px;
        border-radius: 12px;
        line-height: 1.55;
        overflow-wrap: anywhere
      }

      .msg.user {
        align-self: flex-end;
        background: var(--dim);
        border-bottom-right-radius: 3px
      }

      .msg.assistant {
        align-self: flex-start;
        background: #112321;
        border: 1px solid var(--edge);
        border-bottom-left-radius: 3px
      }

      .msg.system {
        align-self: center;
        max-width: 100%;
        text-align: center;
        color: var(--muted);
        font: 400 12px "JetBrains Mono", monospace;
        padding: 2px 8px
      }

      .msg.typing {
        color: var(--muted);
        animation: blink 1s ease-in-out infinite
      }

      @keyframes blink {
        50% {
          opacity: .35
        }
      }

      .row {
        display: flex;
        gap: 10px;
        padding: 14px 16px;
        border-top: 1px solid var(--edge)
      }

      .row input {
        flex: 1;
        min-width: 0;
        background: #0d1a18;
        border: 1px solid var(--edge);
        color: var(--text);
        border-radius: 10px;
        padding: 12px 14px;
        font: inherit
      }

      .row input:focus {
        outline: 1px solid var(--accent)
      }

      .row button {
        background: var(--accent);
        color: #04110f;
        border: 0;
        border-radius: 10px;
        padding: 0 22px;
        font: 600 14px Inter, sans-serif;
        cursor: pointer
      }

      .row button:disabled {
        opacity: .5;
        cursor: default
      }

      .item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        background: #0e1d1b;
        border: 1px solid var(--edge);
        border-radius: 10px
      }

      .item .txt {
        flex: 1;
        overflow-wrap: anywhere
      }

      .item.done {
        opacity: .45
      }

      .item.done .txt {
        text-decoration: line-through
      }

      .item .meta {
        font: 400 12px "JetBrains Mono", monospace;
        color: var(--muted)
      }

      .item input {
        width: 18px;
        height: 18px;
        accent-color: var(--accent)
      }

      .del {
        background: none;
        border: 0;
        color: var(--danger);
        font-size: 16px;
        cursor: pointer;
        padding: 4px 8px
      }

      .empty {
        color: var(--muted);
        text-align: center;
        padding: 40px 12px;
        font-size: 14px
      }

      button:focus-visible,
      .orb:focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 2px
      }

      @media(max-width:860px) {
        :root {
          --orb: 170px
        }

        .app {
          height: auto;
          min-height: 100dvh;
          grid-template-columns: 1fr;
          grid-template-rows: auto minmax(440px, 1fr);
          gap: 20px;
          padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom))
        }

        .hud {
          gap: 14px
        }

        .dials {
          gap: 22px
        }

        .scroll {
          padding: 14px
        }
      }

      @media(prefers-reduced-motion:reduce) {

        .bezel,
        .orb.listening,
        .orb.thinking,
        .msg.typing {
          animation: none
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <section class="hud">
        <div class="brand">J.A.R.V.I.S <small>Core interface</small>
        </div>
        <div class="clock">
          <i class="dot"></i>
          <span id="clock">--:--:--</span>
        </div>
        <div class="orb-outer">
          <div class="bezel"></div>
          <canvas id="globe"></canvas>
          <button class="orb" id="orb" aria-label="Tap to talk"></button>
        </div>
        <div class="status" id="status">Idle</div>
        <div class="dials" id="dials"></div>
      </section>
      <section class="work">
        <div class="tabs" role="tablist">
          <button class="tab active" data-tab="chat">Chat</button>
          <button class="tab" data-tab="tasks">Tasks</button>
          <button class="tab" data-tab="rem">Reminders</button>
        </div>
        <div class="panel active" id="p-chat">
          <div class="scroll" id="log"></div>
          <div class="row">
            <input id="txt" placeholder="Type a message, or tap the orb to talk" autocomplete="off">
            <button id="send">Send</button>
          </div>
        </div>
        <div class="panel" id="p-tasks">
          <div class="scroll" id="taskList"></div>
          <div class="row">
            <input id="taskIn" placeholder="Add a task" autocomplete="off">
            <button id="taskAdd">Add</button>
          </div>
        </div>
        <div class="panel" id="p-rem">
          <div class="scroll" id="remList"></div>
          <div class="row">
            <input id="remIn" placeholder="e.g. walk the dog in 20 minutes" autocomplete="off">
            <button id="remAdd">Set</button>
          </div>
        </div>
      </section>
    </div>
    <script>
      const $ = id => document.getElementById(id);
      const CFG = {
        PROXY_URL: 'https://patient-disk-e88d.grantbonny59.workers.dev',
        MODEL: 'claude-sonnet-5-5', // must be a model your Worker/provider accepts
        VOICE: 'wDsJlOXPqcvIUKdLXjDs',
        TTS_MODEL: 'eleven_flash_v2_5' // faster than eleven_v3 for live replies
      };
      const SYSTEM = `You are JARVIS, a calm, precise, highly capable AI assistant for a student who loves physics, mathematics, aerospace and programming. Be accurate, never invent facts, and say plainly when you are unsure. Your replies are read aloud and shown in small chat bubbles, so speak in short, natural sentences with no markdown, lists, headings or symbols. Go into depth only when asked.`;
      // ---------- state ----------
      const load = k => {
        try {
          return JSON.parse(localStorage.getItem('jarvis_' + k)) || [];
        } catch {
          return [];
        }
      };
      let tasks = load('tasks'),
        rems = load('rems'),
        hist = [],
        busy = false;
      const save = () => {
        try {
          localStorage.setItem('jarvis_tasks', JSON.stringify(tasks));
          localStorage.setItem('jarvis_rems', JSON.stringify(rems));
        } catch {}
      };
      const uid = () => Date.now() + '-' + Math.random().toString(36).slice(2, 7);
      const esc = s => s.replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      } [c]));
      // ---------- tabs ----------
      document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
        document.querySelectorAll('.tab,.panel').forEach(e => e.classList.remove('active'));
        b.classList.add('active');
        $('p-' + b.dataset.tab).classList.add('active');
      });
      // ---------- chat log ----------
      function addMsg(role, text, cls = '') {
        const d = document.createElement('div');
        d.className = 'msg ' + role + ' ' + cls;
        d.textContent = text;
        $('log').appendChild(d);
        $('log').scrollTop = $('log').scrollHeight;
        return d;
      }
      const sys = t => addMsg('system', t);
      sys('JARVIS online. Ask anything, or try "add task read chapter 3" or "remind me to stretch in 10 minutes".');
      // ---------- status ----------
      const orb = $('orb');

      function setStatus(mode, label) {
        const s = $('status');
        s.textContent = label;
        s.className = 'status' + (mode === 'listening' || mode === 'thinking' ? ' live' : mode === 'speaking' ? ' speaking' : '');
        orb.classList.toggle('listening', mode === 'listening');
        orb.classList.toggle('thinking', mode === 'thinking');
        window.__globe = mode !== 'idle';
      }
      // ---------- speech out ----------
      const audio = new Audio(); // one reused element keeps mobile autoplay unlocked
      let unlocked = false;

      function unlockAudio() {
        if (unlocked) return;
        unlocked = true;
        audio.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
        audio.play().catch(() => {});
      }

      function browserSpeak(t) {
        if (!('speechSynthesis' in window)) return setStatus('idle', 'Idle');
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(t);
        u.onstart = () => setStatus('speaking', 'Speaking');
        u.onend = u.onerror = () => setStatus('idle', 'Idle');
        speechSynthesis.speak(u);
      }
      async function speak(text) {
        const t = text.replace(/[*_#`>]/g, '').trim();
        if (!t) return;
        try {
          const r = await fetch(CFG.PROXY_URL + '/tts', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              text: t,
              voice_id: CFG.VOICE,
              model_id: CFG.TTS_MODEL
            })
          });
          if (!r.ok) throw new Error('tts ' + r.status);
          const url = URL.createObjectURL(new Blob([await r.arrayBuffer()], {
            type: 'audio/mpeg'
          }));
          audio.src = url;
          audio.onplay = () => setStatus('speaking', 'Speaking');
          audio.onended = () => {
            setStatus('idle', 'Idle');
            URL.revokeObjectURL(url);
          };
          await audio.play();
        } catch {
          browserSpeak(t);
        }
      }

      function stopSpeaking() {
        audio.pause();
        if ('speechSynthesis' in window) speechSynthesis.cancel();
        setStatus('idle', 'Idle');
      }
      // ---------- speech in ----------
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      let rec = null,
        listening = false,
        recorder = null,
        chunks = [],
        recording = false,
        safety;

      function browserListen() {
        if (!SR) return sys('Voice input is not supported in this browser. Use Chrome or Edge, or type instead.');
        if (listening) return rec.stop();
        rec = new SR();
        rec.lang = 'en-US';
        rec.interimResults = false;
        rec.onstart = () => {
          listening = true;
          setStatus('listening', 'Listening');
        };
        rec.onend = () => {
          listening = false;
          if ($('status').textContent === 'Listening') setStatus('idle', 'Idle');
        };
        rec.onerror = e => {
          listening = false;
          setStatus('idle', 'Idle');
          sys('Voice input error: ' + e.error);
        };
        rec.onresult = e => handle(e.results[0][0].transcript);
        try {
          rec.start();
        } catch (e) {
          sys('Could not start listening: ' + e.message);
        }
      }
      async function startRecording() {
        if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return browserListen();
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: true
          });
          chunks = [];
          recorder = new MediaRecorder(stream);
          recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
          recorder.onstop = async () => {
            stream.getTracks().forEach(t => t.stop());
            clearTimeout(safety);
            recording = false;
            if (!chunks.length) return setStatus('idle', 'Idle');
            await transcribe(new Blob(chunks, {
              type: recorder.mimeType || 'audio/webm'
            }));
          };
          recorder.start();
          recording = true;
          setStatus('listening', 'Listening');
          safety = setTimeout(() => recording && recorder.stop(), 20000);
        } catch (e) {
          sys('Microphone blocked (' + e.name + '). Allow it from the lock icon in the address bar.');
        }
      }
      async function transcribe(blob) {
        setStatus('thinking', 'Transcribing');
        try {
          const fd = new FormData();
          fd.append('audio', blob, 'audio.webm');
          const r = await fetch(CFG.PROXY_URL + '/stt', {
            method: 'POST',
            body: fd
          });
          const d = await r.json();
          if (!r.ok || d.error) throw new Error('stt');
          const t = (d.text || '').trim();
          if (!t) {
            sys('Did not catch that. Try again.');
            return setStatus('idle', 'Idle');
          }
          handle(t);
        } catch {
          sys('Cloud transcription failed, using browser voice input.');
          setStatus('idle', 'Idle');
          browserListen();
        }
      }
      orb.onclick = () => {
        unlockAudio();
        if (!audio.paused || ('speechSynthesis' in window && speechSynthesis.speaking)) return stopSpeaking();
        if (recording) return recorder.stop();
        startRecording();
      };
      // ---------- input routing ----------
      function send() {
        const v = $('txt').value.trim();
        if (v) {
          $('txt').value = '';
          unlockAudio();
          handle(v);
        }
      }
      $('send').onclick = send;
      $('txt').onkeydown = e => {
        if (e.key === 'Enter') send();
      };

      function parseReminder(t) {
        const m = t.match(/remind me (?:to (.+?) )?in (\d+)\s*(second|minute|hour)s?\b(?:\s*to (.+))?/i);
        const task = m && (m[1] || m[4]);
        if (!task) return null;
        const n = +m[2],
          u = m[3].toLowerCase();
        return {
          task: task.replace(/[.!?]+$/, '').trim(),
          ms: n * {
            second: 1e3,
            minute: 6e4,
            hour: 36e5
          } [u],
          label: n + ' ' + u + (n === 1 ? '' : 's')
        };
      }

      function handle(text) {
        addMsg('user', text);
        const r = parseReminder(text);
        if (r) {
          addReminder(r.task, r.ms);
          return reply('Reminder set: "' + r.task + '" in ' + r.label + '.');
        }
        const m = text.match(/add (?:a )?task[: ]+(?:to )?(.+)/i) || text.match(/add (.+) to (?:my )?(?:task|to-?do) list/i);
        if (m) {
          const t = m[1].replace(/[.!?]+$/, '').trim();
          addTask(t);
          return reply('Added to your tasks: "' + t + '".');
        }
        ask(text);
      }

      function reply(t) {
        addMsg('assistant', t);
        speak(t);
      }
      // ---------- AI ----------
      function extract(d) {
        if (Array.isArray(d.content)) return d.content.map(b => b.text || '').join(' ').trim(); // Anthropic format
        if (d.choices?.[0]?.message?.content) return d.choices[0].message.content.trim(); // OpenAI / OpenRouter format
        if (d.candidates?.[0]?.content?.parts) return d.candidates[0].content.parts.map(p => p.text || '').join(' ').trim(); // Gemini
        return '';
      }
      async function ask(text) {
        if (busy) return;
        busy = true;
        $('send').disabled = true;
        setStatus('thinking', 'Thinking');
        const typing = addMsg('assistant', 'Thinking…', 'typing');
        hist.push({
          role: 'user',
          content: text
        });
        hist = hist.slice(-14);
        while (hist.length && hist[0].role !== 'user') hist.shift();
        try {
          const r = await fetch(CFG.PROXY_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              model: CFG.MODEL,
              max_tokens: 600,
              system: SYSTEM,
              messages: hist
            })
          });
          const d = await r.json().catch(() => ({}));
          if (!r.ok || d.error) throw new Error(d.error?.message || d.error || 'HTTP ' + r.status);
          const out = extract(d) || 'I did not get a clear response. Please try again.';
          hist.push({
            role: 'assistant',
            content: out
          });
          typing.remove();
          addMsg('assistant', out);
          speak(out);
        } catch (e) {
          hist.pop(); // drop the unanswered question so history stays valid
          typing.remove();
          sys('Could not get a reply: ' + (e.message || e));
          setStatus('idle', 'Idle');
        } finally {
          busy = false;
          $('send').disabled = false;
        }
      }
      // ---------- tasks ----------
      function addTask(t) {
        tasks.push({
          id: uid(),
          text: t,
          done: false
        });
        save();
        renderTasks();
      }

      function renderTasks() {
        const el = $('taskList');
        if (!tasks.length) el.innerHTML = ' < div class = "empty" > No tasks yet.Add one below, or say "add task …". < /div>';
        else {
          el.innerHTML = '';
          tasks.slice().reverse().forEach(t => {
            const d = document.createElement('div');
            d.className = 'item' + (t.done ? ' done' : '');
            d.innerHTML = ' < input type = "checkbox"
            ' + (t.done ? '
            checked ' : '
            ') + '
            aria - label = "Done" > < span class = "txt" > ' + esc(t.text) + ' < /span> < button class = "del"
            aria - label = "Delete" > ✕ < /button>';
            d.querySelector('input').onchange = () => {
              t.done = !t.done;
              save();
              renderTasks();
            };
            d.querySelector('.del').onclick = () => {
              tasks = tasks.filter(x => x.id !== t.id);
              save();
              renderTasks();
            };
            el.appendChild(d);
          });
        }
        updateDials();
      }
      $('taskAdd').onclick = () => {
        const v = $('taskIn').value.trim();
        if (v) {
          addTask(v);
          $('taskIn').value = '';
        }
      };
      $('taskIn').onkeydown = e => {
        if (e.key === 'Enter') $('taskAdd').click();
      };
      // ---------- reminders ----------
      function addReminder(task, ms) {
        if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
        const r = {
          id: uid(),
          task,
          created: Date.now(),
          due: Date.now() + ms,
          fired: false
        };
        rems.push(r);
        save();
        schedule(r);
        renderRems();
      }

      function schedule(r) {
        if (r.fired) return;
        setTimeout(() => {
          const c = rems.find(x => x.id === r.id);
          if (c && !c.fired) fire(c);
        }, Math.min(Math.max(r.due - Date.now(), 0), 2147483000));
      }

      function fire(r) {
        r.fired = true;
        save();
        renderRems();
        addMsg('assistant', 'Reminder: ' + r.task);
        speak('Reminder: ' + r.task);
        if ('Notification' in window && Notification.permission === 'granted') new Notification('JARVIS', {
          body: r.task
        });
      }
      const left = ms => {
          const m = Math.round(ms / 6e4);
          return ms <= 0 ? 'due' : m < 1 ? ' < 1 min ' : m < 60 ? m + '
          min ' : Math.round(m / 60) + '
          hr '; };

          function renderRems() {
            const el = $('remList');
            if (!rems.length) el.innerHTML = ' < div class = "empty" > No reminders.Try "walk the dog in 20 minutes". < /div>';
            else {
              el.innerHTML = '';
              rems.slice().reverse().forEach(r => {
                const d = document.createElement('div');
                d.className = 'item' + (r.fired ? ' done' : '');
                d.innerHTML = ' < span class = "txt" > ' + esc(r.task) + ' < /span> < span class = "meta" > ' + (r.fired ? '
                done ' : left(r.due - Date.now())) + ' < /span> < button class = "del"
                aria - label = "Delete" > ✕ < /button>';
                d.querySelector('.del').onclick = () => {
                  rems = rems.filter(x => x.id !== r.id);
                  save();
                  renderRems();
                };
                el.appendChild(d);
              });
            }
            updateDials();
          }

          function addRemFromInput() {
            const v = $('remIn').value.trim();
            if (!v) return;
            const p = parseReminder('remind me to ' + v) || parseReminder('remind me ' + v);
            if (p) {
              addReminder(p.task, p.ms);
              $('remIn').value = '';
            } else $('remList').insertAdjacentHTML('afterbegin', ' < div class = "empty" > Use the form "task in 10 minutes". < /div>');
            }
            $('remAdd').onclick = addRemFromInput;
            $('remIn').onkeydown = e => {
              if (e.key === 'Enter') addRemFromInput();
            };
            // ---------- dials + clock ----------
            const C = 2 * Math.PI * 26;
            $('dials').innerHTML = [
              ['date', 'Today'],
              ['tasks', 'Tasks'],
              ['next', 'Next alert']
            ].map(([k, l]) => `
														<div class="dial">
															<svg viewBox="0 0 64 64">
																<circle class="t" cx="32" cy="32" r="26"/>
																<circle class="p" id="r-${k}" cx="32" cy="32" r="26" style="stroke-dasharray:${C};stroke-dashoffset:${C}"/>
															</svg>
															<b id="n-${k}">–</b>
															<span>${l}</span>
														</div>`).join('');
            const ring = (k, f, label) => {
              $('r-' + k).style.strokeDashoffset = C * (1 - Math.max(0, Math.min(1, f || 0)));
              $('n-' + k).textContent = label;
            };

            function updateDials() {
              const n = new Date();
              ring('date', (n.getHours() * 3600 + n.getMinutes() * 60 + n.getSeconds()) / 86400, n.getDate());
              const done = tasks.filter(t => t.done).length;
              ring('tasks', tasks.length ? done / tasks.length : 0, tasks.length ? done + '/' + tasks.length : '0');
              const up = rems.filter(r => !r.fired).sort((a, b) => a.due - b.due)[0];
              if (up) ring('next', (Date.now() - up.created) / Math.max(1, up.due - up.created), left(up.due - Date.now()).replace(' min', 'm').replace(' hr', 'h'));
              else ring('next', 0, '–');
            }
            setInterval(() => {
              $('clock').textContent = new Date().toLocaleString('en-GB', {
                weekday: 'short',
                day: '2-digit',
                month: 'short',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
              });
              updateDials();
            }, 1000);
            setInterval(renderRems, 30000);
            // ---------- globe ----------
            (function() {
              const cv = $('globe'),
                ctx = cv.getContext('2d');
              let S = 0;
              const pts = Array.from({
                length: 90
              }, () => {
                const a = Math.acos(2 * Math.random() - 1),
                  b = Math.random() * 6.2832;
                return [Math.sin(a) * Math.cos(b), Math.cos(a), Math.sin(a) * Math.sin(b)];
              });
              let ay = 0;
              const ax = .3;

              function fit() {
                const d = devicePixelRatio || 1;
                S = cv.clientWidth;
                cv.width = cv.height = S * d;
                ctx.setTransform(d, 0, 0, d, 0, 0);
              }
              new ResizeObserver(fit).observe(cv);
              fit();
              (function draw() {
                ctx.clearRect(0, 0, S, S);
                const R = S * .38,
                  c = S / 2;
                ay += window.__globe ? .012 : .004;
                const P = pts.map(([x, y, z]) => {
                  const x1 = x * Math.cos(ay) - z * Math.sin(ay),
                    z1 = x * Math.sin(ay) + z * Math.cos(ay);
                  const y1 = y * Math.cos(ax) - z1 * Math.sin(ax),
                    z2 = y * Math.sin(ax) + z1 * Math.cos(ax);
                  return {
                    x: c + x1 * R,
                    y: c + y1 * R,
                    z: z2
                  };
                });
                ctx.lineWidth = .6;
                for (let i = 0; i < P.length; i++)
                  for (let j = i + 1; j < P.length; j++) {
                    const a = P[i],
                      b = P[j];
                    if (Math.hypot(a.x - b.x, a.y - b.y) < R * .42) {
                      ctx.strokeStyle = `rgba(45,212,191,${Math.max(0, (a.z + b.z) / 2 + 1) / 2 * .22})`;
                      ctx.beginPath();
                      ctx.moveTo(a.x, a.y);
                      ctx.lineTo(b.x, b.y);
                      ctx.stroke();
                    }
                  }
                ctx.strokeStyle = 'rgba(45,212,191,.25)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(c, c, R + 14, 0, 6.2832);
                ctx.stroke();
                P.forEach(p => {
                  const d = (p.z + 1) / 2;
                  ctx.fillStyle = `rgba(45,212,191,${.25 + d * .65})`;
                  ctx.beginPath();
                  ctx.arc(p.x, p.y, 1 + d * 1.8, 0, 6.2832);
                  ctx.fill();
                });
                requestAnimationFrame(draw);
              })();
            })();
            // ---------- boot ----------
            renderTasks();
            renderRems();
            rems.forEach(schedule);
            updateDials();
            setStatus('idle', 'Idle');
    </script>
  </body>
</html>
